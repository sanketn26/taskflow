syntax = "proto3";

package taskwire.v1;

option go_package = "github.com/sanketn26/taskwire/agent/pkg/protocol/pb;pb";

// TaskwireControl is the authoritative control-plane contract. gRPC over
// HTTP/2 supplies framing, request correlation, deadlines, flow control, and
// cancellation; Taskwire defines only the messages and their semantics.
//
// Task inputs and results remain opaque bytes identified by ValueRef.codec;
// "msgpack" there is an application-value codec, not the control-plane
// encoding.
//
// Roles (runtime, worker, admin) are carried in per-RPC metadata rather than a
// HELLO handshake message; see docs/protocol.md. Errors use gRPC status codes
// with a Taskwire stable error code in the status details.
service TaskwireControl {
  // --- Runtime (submitting application) --------------------------------

  // Submit enqueues one task. The response is sent only after the input and
  // task-state durability boundary, preserving the durable submit ACK.
  rpc Submit(TaskEnvelope) returns (SubmitResponse);

  // WatchResults streams terminal result notifications for one owner,
  // resuming after the supplied cursor. Replaces RESUME_RESULTS plus
  // unsolicited RESULT frames: stream position is the cursor, so a
  // reconnecting Runtime replays by reopening the stream.
  rpc WatchResults(WatchResultsRequest) returns (stream ResultNotification);

  // AckResult confirms durable client-side handling of one notification so
  // the agent may release it before retention expiry.
  rpc AckResult(AckResultRequest) returns (AckResultResponse);

  // Cancel requests cancellation of an owner's task.
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // QueryTasks returns owner-isolated task snapshots.
  rpc QueryTasks(TaskQuery) returns (TaskSnapshot);

  // --- Worker ----------------------------------------------------------

  // RegisterTasks atomically replaces the connection's task capability set.
  rpc RegisterTasks(TaskRegistration) returns (RegisterTasksResponse);

  // Work is the worker's long-lived duplex session. The worker sends its
  // registration, pull requests, heartbeats, and completions; the agent
  // sends leased tasks. Stream lifetime bounds lease ownership, so a
  // dropped connection is an unambiguous signal to reap leases.
  rpc Work(stream WorkerMessage) returns (stream AgentMessage);

  // --- Objects ---------------------------------------------------------

  // PutObject streams object content; the response carries the canonical
  // ObjectRef after size/checksum verification and the durability boundary.
  rpc PutObject(stream ObjectChunk) returns (PutObjectResponse);

  // GetObject streams stored object content.
  rpc GetObject(ObjectGetRequest) returns (stream ObjectChunk);

  // --- Admin / cluster --------------------------------------------------

  // Status returns an agent status snapshot. Also serves as the readiness
  // probe used by the CLI and test harness.
  rpc Status(StatusRequest) returns (StatusSnapshot);

  // ForwardTask transfers a task to a peer agent (cluster, Phase 5).
  rpc ForwardTask(ForwardedTask) returns (ForwardTaskResponse);

  // ForwardCompletion returns a remote completion to the origin agent.
  rpc ForwardCompletion(ForwardedCompletion) returns (ForwardCompletionResponse);

  // Steal requests work from a peer agent (cluster, Phase 5).
  rpc Steal(StealRequest) returns (StealResponse);
}

// --- Worker session envelopes ------------------------------------------

// WorkerMessage is the worker-to-agent branch of the Work stream.
message WorkerMessage {
  oneof body {
    WorkerRegistration register = 1;
    PullRequest pull = 2;
    HeartbeatRequest heartbeat = 3;
    Completion complete = 4;
  }
}

// AgentMessage is the agent-to-worker branch of the Work stream.
message AgentMessage {
  oneof body {
    LeasedTask task = 1;
    HeartbeatResponse heartbeat_ack = 2;
    CompletionResponse complete_ack = 3;
    WorkerRegistrationResponse registered = 4;
  }
}

// WorkerRegistration opens a Work stream: it carries the identity fields the
// removed worker HELLO used to establish, plus the initial capability set.
message WorkerRegistration {
  string worker_id = 1;
  string runtime = 2;
  string runtime_version = 3;
  string sdk_version = 4;
  repeated string codecs = 5;
  TaskRegistration tasks = 6;
}

message WorkerRegistrationResponse {
  string worker_id = 1;
  uint64 generation = 2;
  uint32 accepted = 3;
}

// --- Core value and reference types ------------------------------------

message ObjectRef {
  string store = 1;
  string key = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  string codec = 5;
}

message ValueRef {
  oneof location {
    bytes inline = 1;
    ObjectRef object = 2;
  }
  string codec = 3;
}

message PullRequest {
  string worker_id = 1;
  uint64 capability_generation = 2;
}

message TaskCapability {
  string task_name = 1;
  string task_version = 2;
  string invocation = 3;
  repeated string codecs = 4;
}

message TaskRegistration {
  string worker_id = 1;
  uint64 generation = 2;
  repeated TaskCapability tasks = 3;
}

message RegisterTasksResponse {
  string worker_id = 1;
  uint64 generation = 2;
  uint32 accepted = 3;
}

message TaskQuery {
  bytes owner_id = 1;
  repeated bytes task_ids = 2;
}

message TaskSnapshotEntry {
  bytes task_id = 1;
  string state = 2;
  optional uint64 cursor = 3;
  oneof outcome {
    ObjectRef result = 4;
    Failure failure = 5;
  }
}

message TaskSnapshot { repeated TaskSnapshotEntry tasks = 1; }

message TaskEnvelope {
  bytes owner_id = 1;
  string task_name = 2;
  string task_version = 3;
  string invocation = 4;
  ValueRef input = 5;
  map<string, string> labels = 6;
  bool idempotent = 7;
  int64 submitted_at_unix_ms = 8;
}

message SubmitResponse { bytes task_id = 1; }

message LeasedTask {
  TaskEnvelope task = 1;
  bytes task_id = 2;
  bytes lease_id = 3;
  uint32 ttl_ms = 4;
  uint32 attempt = 5;
}

message Completion {
  bytes lease_id = 1;
  oneof outcome {
    ObjectRef result = 2;
    Failure failure = 3;
  }
}

message CompletionResponse { bytes lease_id = 1; }

message ForwardedTask {
  bytes transfer_id = 1;
  string origin_node = 2;
  TaskEnvelope task = 3;
}

message ForwardTaskResponse {
  bytes task_id = 1;
  bytes transfer_id = 2;
}

message ForwardedCompletion {
  bytes transfer_id = 1;
  string remote_node = 2;
  uint32 remote_attempt = 3;
  oneof outcome {
    ObjectRef result = 4;
    Failure failure = 5;
  }
}

message ForwardCompletionResponse { bytes transfer_id = 1; }

message Failure {
  string code = 1;
  string message = 2;
  ValueRef details = 3;
  bool retryable = 4;
}

message ResultNotification {
  bytes owner_id = 1;
  bytes task_id = 2;
  uint64 cursor = 3;
  string state = 4;
  oneof outcome {
    ObjectRef result = 5;
    Failure failure = 6;
  }
}

message WatchResultsRequest {
  bytes owner_id = 1;
  uint64 after_cursor = 2;
}

message AckResultRequest {
  bytes owner_id = 1;
  bytes task_id = 2;
  uint64 cursor = 3;
}

message AckResultResponse {}

message StatusSnapshot {
  string version = 1;
  uint64 pid = 2;
  bool ready = 3;
  map<string, uint64> task_counts = 4;
  uint64 active_leases = 5;
  repeated uint64 worker_pids = 6;
  uint64 worker_restarts = 7;
  bool storage_healthy = 8;
  uint64 cluster_members = 9;
  uint64 kafka_outbox_pending = 10;
  optional string last_error_code = 11;
}

// Error is carried in gRPC status details so a stable Taskwire code and
// retryability survive alongside the transport status code.
message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> details = 4;
}

message HeartbeatRequest { bytes lease_id = 1; }
message HeartbeatResponse { bytes lease_id = 1; }

message CancelRequest {
  bytes owner_id = 1;
  bytes task_id = 2;
}

message CancelResponse {
  bytes task_id = 1;
  bool cancelled = 2;
}

message ObjectGetRequest { ObjectRef object = 1; }

message PutObjectResponse { ObjectRef object = 1; }

// ObjectChunk carries object content. The first chunk of a PutObject stream
// sets metadata (codec, size, sha256); subsequent chunks carry data only.
// gRPC delivers chunks in order, so an explicit sequence number is no longer
// part of the contract.
message ObjectChunk {
  bytes data = 1;
  string codec = 2;
  uint64 size = 3;
  bytes sha256 = 4;
}

message StealRequest {
  string requester_node = 1;
  map<string, string> labels = 2;
  uint32 limit = 3;
}

message StealResponse {
  bytes transfer_id = 1;
  uint32 accepted = 2;
}

message StatusRequest {}
