[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taskwire"
version = "0.1.0.dev0"
description = "Kubernetes-native distributed task execution for Python"
authors = [{ name = "Sanket Naik", email = "sanketn@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tasks", "distributed", "parallel", "worker", "queue", "kubernetes"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sanketn26/taskwire"
Repository = "https://github.com/sanketn26/taskwire.git"
Documentation = "https://github.com/sanketn26/taskwire/tree/main/docs"
Issues = "https://github.com/sanketn26/taskwire/issues"
Changelog = "https://github.com/sanketn26/taskwire/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskwire"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: needs a running controller (built from the Go binary)",
  "packaging: builds the wheel and installs it into a clean environment",
  "chaos: injects seeded process/controller faults",
  "kubernetes: requires a kind cluster",
]

[tool.ruff]
# Matches requires-python = ">=3.11". Without this, ruff
# assumes an older target and misclassifies stdlib modules added in 3.11
# (notably tomllib) as third-party imports.
target-version = "py311"

# `taskwire` and `harness` live under src/ and beside pyproject.toml rather than
# the usual place, so tell isort they are first-party; otherwise it sorts
# the installed package into the third-party block.
[tool.ruff.lint.isort]
known-first-party = ["taskwire", "harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by `ruff format`
