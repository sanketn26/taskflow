# taskwire configuration
# Shared between taskwire-agent (Go) and the Python SDK.
# Platform engineers own this file. Developers never touch it.

cluster:
  enabled: false                    # multi-node listeners/discovery are off by default
  allow_insecure: false             # development only; requires an explicit opt-out of auth
  node_name: ""                    # auto-generated UUID if empty
  bind_addr: "0.0.0.0:7946"       # gossip protocol bind address
  advertise_addr: ""               # routable host:port peers use for gossip
  task_port: 7947                  # cluster TCP endpoint for STEAL/forwarding
  seeds: []                        # ["10.0.1.1:7946", "10.0.1.2:7946"]
  mdns: true                       # zero-config discovery on local networks
  encryption_key: ""               # base64 32-byte key for gossip encryption + cluster TCP auth

# Unix socket path — Python SDK connects here
socket: "/var/run/taskwire/agent.sock"
socket_group: "taskwire"           # socket chmod 0660, chown root:taskwire when possible

queue:
  max_attempts: 5                  # lease-expiry requeues before dead-letter
  max_frame_size_mb: 16
  lease_ttl_ms: 30000              # heartbeat interval is derived as ttl/3

storage:
  state:
    type: "sqlite"                 # "memory" | "sqlite" | "postgres"
    sqlite:
      path: "/var/lib/taskwire/state.db"
    postgres:
      dsn_env: "TASKWIRE_POSTGRES_DSN"

  objects:
    default: "local"
    inline_threshold_bytes: 65536
    result_retention_seconds: 86400
    stores:
      local:
        type: "filesystem"         # "memory" | "filesystem" | "s3"
        path: "/var/lib/taskwire/objects"
      shared:
        type: "s3"
        bucket: ""
        prefix: "taskwire/objects/"
        region: ""

ipc:
  submit_ack_timeout_ms: 5000      # Runtime fails submission if ACK does not arrive

workers:
  count: 4                         # Python worker processes to spawn
  labels:
    workload: "general"            # used by routing rules
  resources:
    max_memory_mb: 2048
    max_cpu_percent: 80

routing:
  rules: []
  # Example: route tasks labelled "cpu" to nodes with workload=compute
  # - match:
  #     label: "cpu"
  #   prefer:
  #     workload: "compute"

result_delivery:
  mode: "agent"                    # "agent" (default) or "queue" (Kafka)
  queue:
    type: "kafka"
    brokers: []                    # ["kafka:9092"]
    topic: "taskwire-results"

metrics:
  listen_addr: ""                  # e.g. "127.0.0.1:9464"; empty disables /metrics
