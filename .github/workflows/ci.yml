name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

env:
  DEV_PYTHON_DEPS: "pytest pytest-cov ruff build pyyaml cloudpickle msgpack"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install $DEV_PYTHON_DEPS
      - run: make lint PYTHON=python

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install $DEV_PYTHON_DEPS
      - run: make unit PYTHON=python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            **/*.log
          if-no-files-found: ignore

  smoke:
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - name: Build wheel and smoke test in a clean venv
        run: make smoke-wheel PYTHON=python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/
            **/*.log
          if-no-files-found: ignore

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install $DEV_PYTHON_DEPS
      - name: Build wheel and install into a clean environment
        run: |
          make wheel PYTHON=python
          python -m venv /tmp/it-venv
          /tmp/it-venv/bin/pip install --quiet dist/*.whl pytest
      - name: Run integration tests against the installed artifact
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: /tmp/it-venv/bin/python -m pytest python/tests/integration -v -m integration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            **/*.log
            dist/
          if-no-files-found: ignore
