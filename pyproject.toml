[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "taskwire"
version = "0.1.0"
description = "High-performance distributed task execution — pythonic tasks, Go-powered runtime, no broker required"
authors = ["Sanket Naik <sanketn@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/sanketn26/taskwire"
repository = "https://github.com/sanketn26/taskwire.git"
documentation = "https://github.com/sanketn26/taskwire/tree/main/docs"
keywords = ["tasks", "distributed", "parallel", "worker", "queue", "async"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
packages = [{include = "taskwire", from = "python"}]
# The Go agent binary is staged to python/taskwire/bin/ by `make wheel`
# (never committed — see .gitignore) and declared here so poetry-core bundles
# it into the wheel. This produces a single-host-platform wheel; multi-platform
# wheel tagging is a follow-up beyond Phase 0's scope.
include = [
  { path = "python/taskwire/bin/taskwire-agent", format = "wheel" },
]

[tool.poetry.dependencies]
python = ">=3.11"
cloudpickle = "^3.0"
pyyaml = "^6.0"
msgpack = "^1.0"
protobuf = ">=6.33.5,<7"
confluent-kafka = {version = "^2.5", optional = true}

[tool.poetry.extras]
kafka = ["confluent-kafka"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "*"
ruff = "^0.4"
build = "^1.2"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python", "."]
markers = [
  "integration: requires a built taskwire-agent binary and drives it end to end",
  "chaos: injects seeded process/network/storage/resource faults",
  "cluster: requires a multi-agent cluster topology",
  "kafka: requires a Kafka broker for delivery-mode tests",
  "resource: exercises resource-pressure or soak scenarios",
]

[tool.ruff]
extend-exclude = ["python/taskwire/protocol/pb"]

[tool.poetry.urls]
homepage = "https://github.com/sanketn26/taskwire"
repository = "https://github.com/sanketn26/taskwire.git"
bug-tracker = "https://github.com/sanketn26/taskwire/issues"
changelog = "https://github.com/sanketn26/taskwire/blob/main/CHANGELOG.md"
