[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taskwire"
version = "0.1.0.dev0"
description = "Kubernetes-native distributed task execution for Python, backed by PostgreSQL"
authors = [{ name = "Sanket Naik", email = "sanketn@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tasks", "distributed", "parallel", "worker", "queue", "kubernetes", "postgresql"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "psycopg[pool]>=3.2",
]

[project.optional-dependencies]
# Plain psycopg needs libpq installed on the system; this bundles it instead.
binary = ["psycopg[binary]>=3.2"]

[project.scripts]
taskwire = "taskwire.cli:main"

[project.urls]
Homepage = "https://github.com/sanketn26/taskwire"
Repository = "https://github.com/sanketn26/taskwire.git"
Documentation = "https://github.com/sanketn26/taskwire/tree/main/docs"
Issues = "https://github.com/sanketn26/taskwire/issues"
Changelog = "https://github.com/sanketn26/taskwire/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "psycopg[binary]>=3.2",
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["python/taskwire"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.venv"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python", "."]
markers = [
  "integration: requires a PostgreSQL instance (TASKWIRE_TEST_DATABASE_URL)",
  "packaging: builds the wheel and installs it into a clean environment",
  "chaos: injects seeded process/database faults",
  "kubernetes: requires a kind cluster",
]

[tool.ruff]
# Matches requires-python = ">=3.11". Without this, ruff
# assumes an older target and misclassifies stdlib modules added in 3.11
# (notably tomllib) as third-party imports.
target-version = "py311"

# `taskwire` and `harness` live under python/ and the repo root rather than
# beside pyproject.toml, so tell isort they are first-party; otherwise it sorts
# the installed package into the third-party block.
[tool.ruff.lint.isort]
known-first-party = ["taskwire", "harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by `ruff format`
