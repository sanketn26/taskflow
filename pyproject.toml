[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taskwire"
version = "0.1.0"
description = "High-performance distributed task execution — pythonic tasks, Go-powered runtime, no broker required"
authors = [{ name = "Sanket Naik", email = "sanketn@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tasks", "distributed", "parallel", "worker", "queue", "async"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cloudpickle>=3.1,<4",
  "pyyaml>=6.0,<7",
  "msgpack>=1.2,<2",
  # Must be >= the protobuf version the committed *_pb2.py was generated with;
  # bump together with `make proto`.
  "protobuf>=7.35.1,<8",
  "grpcio>=1.85,<2",
  "grpcio-status>=1.85,<2",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.16,<3"]

[project.urls]
Homepage = "https://github.com/sanketn26/taskwire"
Repository = "https://github.com/sanketn26/taskwire.git"
Documentation = "https://github.com/sanketn26/taskwire/tree/main/docs"
Issues = "https://github.com/sanketn26/taskwire/issues"
Changelog = "https://github.com/sanketn26/taskwire/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17",
  "grpcio-tools>=1.85",  # `make proto`
]

[tool.hatch.build.targets.wheel]
packages = ["python/taskwire"]
# The Go agent binary is staged to python/taskwire/bin/ by `make wheel`.
# It is gitignored (never committed), so list it as an artifact to force
# inclusion. This yields a single-host-platform wheel; per-platform tagging
# is a follow-up.
artifacts = ["python/taskwire/bin/taskwire-agent"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.venv", "/agent/bin", "/python/taskwire/bin"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python", "."]
markers = [
  "integration: requires a built taskwire-agent binary and drives it end to end",
  "chaos: injects seeded process/network/storage/resource faults",
  "cluster: requires a multi-agent cluster topology",
  "kafka: requires a Kafka broker for delivery-mode tests",
  "resource: exercises resource-pressure or soak scenarios",
]

[tool.ruff]
extend-exclude = ["python/taskwire/protocol/pb"]
# Matches requires-python = ">=3.11". Without this, ruff
# assumes an older target and misclassifies stdlib modules added in 3.11
# (notably tomllib) as third-party imports.
target-version = "py311"

# `taskwire` and `harness` live under python/ and the repo root rather than
# beside pyproject.toml, so tell isort they are first-party; otherwise it sorts
# the installed package into the third-party block.
[tool.ruff.lint.isort]
known-first-party = ["taskwire", "harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by `ruff format`
